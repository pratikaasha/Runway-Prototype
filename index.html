*{box-sizing:border-box}body{margin:0;padding:40px;background:#DDE5EE;font:14px Inter,system-ui,sans-serif;color:var(--ink)}
.row0{display:flex;gap:44px;overflow-x:auto;padding:8px 8px 24px;align-items:flex-start}.w{flex:none;width:393px}.ti{font:500 13px 'DM Sans',system-ui,sans-serif;margin-bottom:8px}
.f{position:relative;width:393px;height:852px;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#E3EEFA 0,#F6F9FC 240px);box-shadow:0 20px 50px rgba(26,48,40,.12);transition:box-shadow .3s}.f.pulse{box-shadow:0 0 0 4px #3385FD,0 20px 50px rgba(26,48,40,.12)}
.sb{height:44px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px 6px;font:600 14px Inter}
.nav{height:52px;flex:none;display:flex;align-items:center;padding:0 var(--s5);gap:var(--s3);font:600 18px 'DM Sans',system-ui,sans-serif;letter-spacing:-.3px}
.bk{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);cursor:pointer}
.bd{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:var(--s5);padding:var(--s2) var(--s5) 110px}.bd::-webkit-scrollbar{display:none}.bd>*{flex:none}
.ft{position:absolute;left:0;right:0;bottom:0;padding:var(--s3) var(--s5) 28px;background:linear-gradient(180deg,rgba(246,249,252,0),#F6F9FC 30%);display:flex;flex-direction:column;align-items:center;gap:var(--s2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sec{font:500 15px 'DM Sans',system-ui,sans-serif;color:var(--mut);margin:0 0 var(--s2) 2px;display:flex;justify-content:space-between;align-items:center}.sec a{font:600 13px Manrope,system-ui,sans-serif;color:var(--blue);cursor:pointer}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.r{display:flex;align-items:center;gap:var(--s3);padding:14px var(--s4);border-bottom:1px solid var(--line);cursor:default}.r:last-child{border:0}.r.k{cursor:pointer}
.ic{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;flex:none;background:#F1F4F8;color:#47608B}.ic.a{background:#FFF1E2;color:#B8620F}.ic.g{background:#E4F5EC;color:#1F7A5C}
.t{flex:1;min-width:0;font:500 16px 'DM Sans',system-ui,sans-serif;letter-spacing:-.2px}.t small{display:block;font:400 12.5px Inter;color:var(--mut);margin-top:2px;letter-spacing:0}
.v{font:600 16px 'DM Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.v small{display:block;font:400 12px Inter;color:var(--mut)}.v.in{color:#1F7A5C}.v s{color:#92999B;text-decoration:none;font-weight:400}.v b{color:#1558B8}
.tag{font:600 11px Manrope,system-ui,sans-serif;padding:3px 8px;border-radius:99px;background:var(--tint);color:#1558B8;white-space:nowrap}.recommend{display:flex;align-items:center;gap:4px;margin:0 0 4px;color:#2279E8;font:700 10px Manrope,system-ui,sans-serif;letter-spacing:.45px;text-transform:uppercase}.recommend svg{width:12px;height:12px;stroke-width:2}.tag.a{background:#FFF1E2;color:#9B641D}
.cta{width:100%;height:54px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:#fff;font:600 16px Manrope,system-ui,sans-serif;cursor:pointer}.cta.off{opacity:.4;pointer-events:none}.cta.g{background:#fff;color:#1558B8;border:1px solid var(--line)}
.lk{display:flex;gap:6px;align-items:center;color:var(--mut);font:400 12px Inter}.lk svg{width:14px;height:14px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:var(--s5);color:#fff;background:radial-gradient(90% 80% at 15% 0,#3D95F2,#1F74E4 55%,#1B63D0);display:flex;flex-direction:column;gap:6px}
.pxart i{position:absolute;border-radius:3px;opacity:.9}.pill{align-self:flex-start;margin-top:10px;position:relative;padding:12px 20px;border-radius:99px;background:#fff;color:#112940;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer}.hero .n{font:600 40px/1.05 'DM Sans',system-ui,sans-serif;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}.hero p{margin:0;font:500 13px Manrope,system-ui,sans-serif;opacity:.9}
.seg{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:var(--s3)}.seg span{height:30px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}.seg i{position:absolute;inset:auto 0 0 0;background:#fff;border-radius:99px}
.bar{height:6px;border-radius:9px;background:#E3EAF3;position:relative;margin-top:8px}.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--blue);transition:width .3s}
.ins{display:flex;gap:var(--s3);align-items:center;padding:var(--s4);background:#fff;border:1px solid var(--line);border-radius:16px;cursor:pointer}.dot{width:8px;height:8px;border-radius:9px;background:#F58A2B;flex:none}
.tab{position:absolute;left:var(--s5);right:var(--s5);bottom:20px;height:64px;border-radius:99px;display:flex;justify-content:space-around;align-items:center;padding:0 6px;background:rgba(255,255,255,.7);backdrop-filter:blur(24px);border:1px solid #fff;box-shadow:0 8px 28px rgba(17,41,64,.14);z-index:3}
.tab div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 22px;border-radius:99px;font:600 11px Manrope,system-ui,sans-serif;color:#47608B;cursor:pointer}.tab .on{background:#3385FD;color:#fff}
.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none}.cp{flex:none;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font:600 13px Manrope,system-ui,sans-serif;color:#47608B;cursor:pointer}.cp.on{background:#112940;color:#fff;border-color:#112940}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:var(--s5) var(--s5) 28px;display:flex;flex-direction:column;gap:var(--s3);transform:translateY(105%);transition:transform .3s;box-shadow:0 -12px 40px rgba(17,41,64,.2);z-index:6;max-height:80%;overflow:auto}.sheet.on{transform:none}.sheet h3{margin:0;font:600 20px 'DM Sans',system-ui,sans-serif;letter-spacing:-.4px}
.dim{position:absolute;inset:0;background:rgba(17,41,64,.35);opacity:0;pointer-events:none;transition:.3s;z-index:5}.dim.on{opacity:1;pointer-events:auto}
.rad{width:22px;height:22px;border-radius:99px;border:2px solid #B7C8DC;flex:none;display:grid;place-items:center;color:#fff}.k.sel .rad{background:var(--blue);border:0}.k.sel{background:#F3F8FF}
.tgl{width:44px;height:26px;border-radius:99px;background:#CBD8E6;position:relative;flex:none;cursor:pointer;transition:.2s}.tgl:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}.tgl.on{background:#3385FD}.tgl.on:after{left:21px}
.inp{display:flex;align-items:center;gap:var(--s2);background:#fff;border:1.5px solid #CFE0F7;border-radius:16px;padding:6px 6px 6px var(--s4)}.inp input{flex:1;border:0;outline:0;font:500 16px 'DM Sans',system-ui,sans-serif;background:none;min-width:0}.snd{width:40px;height:40px;border-radius:99px;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer}
.sk{height:56px;border-radius:16px;background:linear-gradient(90deg,#E8EEF5,#F4F7FB,#E8EEF5) 0/200% 100%;animation:sh 1.1s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.px{height:96px;border-radius:20px;background:linear-gradient(160deg,#3D95F2,#1F74E4);display:grid;place-items:center;color:rgba(255,255,255,.85);font:600 10px Manrope,system-ui,sans-serif;letter-spacing:.6px;text-transform:uppercase;flex:none}
.ok{text-align:center;display:flex;flex-direction:column;gap:var(--s2);align-items:stretch}.ok p{margin:0;color:var(--mut);font:400 14px/20px Inter}

/* Flow B home-goal entry screen, matched to the approved reference */
#planner .bd{padding:8px 20px 140px;gap:14px;overflow-y:auto}
#planner .ft{padding:0 20px 26px;background:linear-gradient(180deg,rgba(246,249,252,0),#F6F9FC 18%);gap:10px}
.goal-entry-card{background:rgba(255,255,255,.96);border:1px solid #fff;border-radius:30px;padding:30px 28px 26px;box-shadow:0 10px 30px rgba(25,48,76,.045);display:flex;flex-direction:column}
.goal-entry-pct{font:500 40px/1 'DM Sans',sans-serif;letter-spacing:-1.8px;color:#17191B}
.goal-entry-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:#92999B;font:400 12px/16px Manrope,sans-serif}
.goal-entry-meta span:last-child{font-size:11px;white-space:nowrap}
.goal-entry-chart{width:100%;display:block;margin-top:32px;overflow:visible}
.goal-entry-chart .axis{font:400 10px Manrope,sans-serif;fill:#A3AAAC}
.goal-entry-chart .grid{stroke:#E9EDED;stroke-width:1}
.goal-entry-chart .current{stroke:#17191B;stroke-width:2.6;fill:none;stroke-linecap:round}
.goal-entry-chart .higher{stroke:#C5CACA;stroke-width:2.3;fill:none;stroke-linecap:round}
.goal-entry-chart .lower{stroke:#E0E4E4;stroke-width:2.3;fill:none;stroke-linecap:round}
.goal-entry-chart .marker{fill:#17191B;stroke:#fff;stroke-width:1.4}
.goal-entry-chart .marker-text{font:700 11px 'DM Sans',sans-serif;fill:#17191B}
.goal-entry-target{display:flex;justify-content:flex-end;margin-top:0;color:#9BA1A3;font:400 11px Manrope,sans-serif}
.goal-entry-legend{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:30px;white-space:nowrap;color:#7B8385;font:400 10.5px Manrope,sans-serif}
.goal-entry-legend span{display:flex;align-items:center;gap:6px}
.goal-entry-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.goal-entry-legend .dot-current{background:#17191B}
.goal-entry-legend .dot-higher{background:#C5CACA}
.goal-entry-legend .dot-lower{background:#E0E4E4}
.goal-entry-helper{margin:0 4px;color:#8996A7;font:400 13px/19px Inter,sans-serif}
#planner .ft .planner-entry-prompt{width:100%;height:58px;display:flex;align-items:center;gap:8px;padding:6px 7px 6px 16px;border:1.5px solid #CFE0F7;border-radius:19px;background:#fff}
#planner .ft .planner-entry-prompt input{min-width:0;flex:1;border:0;outline:0;background:transparent;font:400 15px Inter,sans-serif;color:#17191B}
#planner .ft .planner-entry-prompt input::placeholder{color:#858585}
#planner .ft .planner-entry-prompt .snd{width:44px;height:44px;border-radius:50%;background:#2279E8;display:grid;place-items:center;color:#fff;cursor:pointer;flex:none}
#planner .ft .planner-entry-chips{display:flex;gap:8px;flex-wrap:wrap;width:100%}
#planner .ft .planner-entry-chips .cp{padding:9px 13px;font:500 12px Manrope,sans-serif;background:#fff;border:1px solid #E4EAF1;color:#506A91}


.ask{position:absolute;left:20px;right:20px;bottom:96px;height:54px;border-radius:99px;display:flex;align-items:center;gap:10px;padding:5px 5px 5px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border:1px solid #fff;box-shadow:0 8px 24px rgba(17,41,64,.12);z-index:3;color:#6B7685;font:500 15px 'DM Sans',system-ui,sans-serif;cursor:pointer}.ask .t{flex:1}.ask .m{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;background:var(--blue);color:#fff}
.ask.in{position:static;box-shadow:none;border:1.5px solid #CFE0F7;background:#fff;height:52px;backdrop-filter:none}
.vr{position:absolute;left:0;right:0;bottom:0;height:80%;z-index:8;border-radius:36px 36px 0 0;color:#fff;display:flex;flex-direction:column;padding:14px 24px 34px;transform:translateY(104%);transition:transform .55s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,#9AD4FF 0,#3D95F2 38%,#1B63D0 78%,#1148B8 100%);box-shadow:0 -20px 60px rgba(40,130,240,.45)}.vr.on{transform:none}
.vr .gh{width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.7);align-self:center}
.vr .rg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:500 15px 'DM Sans',system-ui,sans-serif}.vr .rg span:nth-child(2){padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.22)}
#vc{width:240px;height:240px;align-self:center;margin-top:6px}
.vtx{margin-top:12px;font:500 26px/1.2 'DM Sans',system-ui,sans-serif;letter-spacing:-.6px;min-height:96px}.vtx .d{opacity:.7}.vtx .wd{transition:opacity .3s}.vtx .wd.fd{opacity:.45}
.vtx .pl{display:inline-block;margin-top:16px;padding:11px 20px;border-radius:99px;background:#fff;color:#0B3E9E;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer}
.vst{text-align:center;margin-top:auto;padding-bottom:16px;font:500 13px Manrope,system-ui,sans-serif;opacity:.85;min-height:36px}
.vcn{display:flex;justify-content:space-between;align-items:center;padding:0 4px}.vbn{width:48px;height:48px;border-radius:99px;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;cursor:pointer}
.vmic{width:76px;height:76px;border-radius:99px;display:grid;place-items:center;background:#fff;color:#1558B8;cursor:pointer;box-shadow:0 0 0 8px rgba(255,255,255,.25)}.vmic svg{width:28px;height:28px}
.nudge{position:relative;overflow:hidden;border-radius:20px;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);background:linear-gradient(150deg,#EAF3FF,#fff 70%);border:1px solid #D8E7FB}
.nudge h4{margin:0;font:600 22px 'DM Sans',system-ui,sans-serif;letter-spacing:-.6px}
.nudge .in{display:flex;align-items:center;gap:8px;height:56px;padding:6px 6px 6px 16px;border-radius:18px;background:#fff;border:1.5px solid #CFE0F7;color:#8996A7;font:400 15px Inter,system-ui,sans-serif;cursor:pointer}.nudge .in span:first-child{flex:1}.nudge .in .m{width:42px;height:42px;border-radius:99px;display:grid;place-items:center;color:#1558B8;background:#EEF5FE}.nudge .in .g{width:42px;height:42px;border-radius:99px;display:grid;place-items:center;background:var(--blue);color:#fff}
.nudge .cp{background:rgba(255,255,255,.8)}
.an{position:absolute;width:26px;height:26px;border-radius:99px;background:#E8453C;color:#fff;font:700 12px Manrope,system-ui,sans-serif;display:none;place-items:center;z-index:9;box-shadow:0 0 0 5px rgba(232,69,60,.25)}body.ann .an{display:grid}
.nt{display:none!important;margin-top:14px;padding:14px 16px;background:#fff;border:1px solid #F3C9C5;border-radius:16px;font:400 13px/19px Inter,system-ui,sans-serif;color:#17191B;flex-direction:column;gap:8px}body.ann .nt{display:flex}.nt div{display:flex;gap:10px}.nt b{flex:none;width:20px;height:20px;border-radius:99px;background:#E8453C;color:#fff;font:700 11px Manrope;display:grid;place-items:center;margin-top:1px}
.atg{position:fixed;top:12px;right:16px;z-index:50;padding:10px 16px;border-radius:99px;background:#17191B;color:#fff;font:600 13px Manrope,system-ui,sans-serif;cursor:pointer}body.ann .atg{background:#E8453C}
